name: Ausbildung Email Enrichment

on:
  schedule:
    # Run between the two long scrape windows so new offers get enriched
    # after they have been written to Sheets.
    - cron: '0 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: ausbildung-email-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich_missing_emails:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          check-latest: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Validate Python syntax and imports
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python -m py_compile ausbildung_scraper.py email_enrichment.py
          python - <<'PY'
          import os
          import ausbildung_scraper as scraper
          import email_enrichment
          assert hasattr(scraper, "crawl_verified_site")
          assert hasattr(email_enrichment, "exhaustive_company_search")
          assert os.environ.get("GOOGLE_SHEET_WEBHOOK_URL"), "GOOGLE_SHEET_WEBHOOK_URL is missing"
          print("Email enrichment preflight OK")
          PY

      - name: Enrich missing emails from official company websites
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python -u email_enrichment.py
