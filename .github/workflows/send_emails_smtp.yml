name: Send Ausbildung Emails (SMTP)

on:
  # Independent sender: it reads the Google Sheet directly.
  # It does NOT wait for or depend on the scraper workflow.
  schedule:
    - cron: '17 */4 * * *'
      timezone: "Etc/GMT"

  workflow_dispatch:

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only prevents two EMAIL sender runs from sending the same rows
    # simultaneously. It does not block the scraper workflow.
    concurrency:
      group: ausbildung-email-sender
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send up to 20 real emails from the Google Sheet
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: "essaouafhalima@gmail.com"
          BATCH_LIMIT: "20"
          ROLLING_24H_LIMIT: "100"
        run: |
          set -e
          echo "=== Independent SMTP sender ==="
          echo "Schedule: every 4 hours, GMT, at minute 17"
          echo "Target: 20 successful SMTP deliveries per run"
          echo "Persistent rolling 24h cap: 100 successful SMTP deliveries"
          echo "Source: Google Sheet"
          python -u send_emails_smtp.py
