name: Run Ausbildung Scraper Daily

on:
  schedule:
    # S'exécute tous les jours à 3h00 du matin (Heure UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permet de le lancer manuellement quand vous voulez

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run script
        run: |
          python ausbildung_scraper.py

      - name: Save CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: ausbildung-csv
          path: ausbildung_applications_export.csv
