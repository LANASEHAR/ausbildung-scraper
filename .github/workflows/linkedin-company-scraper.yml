name: Remote Morocco - Travel & Hospitality Leads

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "remote_travel_hospitality_scraper.py"
      - ".github/workflows/linkedin-company-scraper.yml"

concurrency:
  group: remote-travel-hospitality
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: false

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Validate
        run: python -m py_compile remote_travel_hospitality_scraper.py

      - name: Verify Google Apps Script Web App before scraping
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = os.environ.get("GOOGLE_SHEET_WEBHOOK_URL", "").strip()
          if not url:
              raise SystemExit("GOOGLE_SHEET_WEBHOOK_URL secret is empty.")

          try:
              response = requests.get(url, timeout=25, allow_redirects=True)
              response.raise_for_status()
              data = response.json()
          except Exception as exc:
              raise SystemExit(
                  "Google Apps Script health check failed before scraping. "
                  "Use the deployed /exec Web App URL, execute as the owner, "
                  "with access available to anyone. "
                  f"Details: {type(exc).__name__}: {exc}"
              )

          if data.get("status") != "ok" or data.get("service") != "Ausbildung webhook":
              raise SystemExit(
                  "Unexpected Apps Script health response; expected "
                  "status=ok and service='Ausbildung webhook'."
              )

          print("Google Apps Script Web App is reachable.")
          PY

      - name: Scrape remote leads
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python -u remote_travel_hospitality_scraper.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: remote-travel-hospitality-leads
          path: remote_travel_hospitality.csv
          if-no-files-found: warn
          retention-days: 14
