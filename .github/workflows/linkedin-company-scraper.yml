name: LinkedIn Hospitality + Travel Company Scraper

on:
  push:
    branches: [main]
    paths:
      - "linkedin_company_scraper.py"
      - ".github/workflows/linkedin-company-scraper.yml"
  workflow_dispatch:

concurrency:
  group: linkedin-company-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape_linkedin_companies:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Validate scraper
        run: |
          python -m py_compile linkedin_company_scraper.py

      - name: Run LinkedIn company scrape
        run: |
          python -u linkedin_company_scraper.py

      - name: Upload company results
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-hospitality-travel-companies
          path: linkedin_hospitality_travel_companies.csv
          if-no-files-found: error
          retention-days: 14
