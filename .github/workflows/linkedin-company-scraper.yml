name: Remote Morocco - Travel & Hospitality Leads

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "remote_travel_hospitality_scraper.py"
      - ".github/workflows/linkedin-company-scraper.yml"

concurrency:
  group: remote-travel-hospitality
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: false

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Validate
        run: python -m py_compile remote_travel_hospitality_scraper.py

      - name: Scrape remote leads
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python -u remote_travel_hospitality_scraper.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: remote-travel-hospitality-leads
          path: remote_travel_hospitality.csv
          if-no-files-found: warn
          retention-days: 14
