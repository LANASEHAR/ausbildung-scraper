name: Scraper Ausbildung Quotidien

on:
  schedule:
    - cron: '0 6 * * *' # Lance le script tous les jours à 6h00 UTC
  workflow_dispatch: # Permet de lancer le script manuellement avec un bouton

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run Scraper
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python nom_de_votre_script.py
