name: Ausbildung Job Scraper

on:
  schedule:
    # Two complete collections per day at 06:00 and 18:00 UTC.
    - cron: '0 6,18 * * *'
  workflow_dispatch:

concurrency:
  group: ausbildung-twice-daily-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape_jobs:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a 6-hour hard limit; the scraper itself stops
    # after ~4h30 so there is enough time to finish uploads cleanly.
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          check-latest: false

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow pytesseract

      - name: Validate Python syntax and imports
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python -m py_compile ausbildung_scraper.py daily_runner.py
          python - <<'PY'
          import os
          import ausbildung_scraper as scraper
          import daily_runner
          assert hasattr(scraper, "iter_collected_links")
          assert hasattr(scraper, "scrape_details")
          assert hasattr(daily_runner, "process_batch")
          assert os.environ.get("GOOGLE_SHEET_WEBHOOK_URL"), "GOOGLE_SHEET_WEBHOOK_URL is missing"
          print("Preflight OK")
          PY

      - name: Run twice-daily time-budget scraper
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python -u daily_runner.py
