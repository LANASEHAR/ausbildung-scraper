name: Ausbildung Job Scraper

on:
  schedule:
    # One complete collection every 24 hours.
    # 02:00 UTC = 04:00 CEST / 03:00 CET.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ausbildung-daily-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape_jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          check-latest: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Validate Python syntax
        run: python -m py_compile ausbildung_scraper.py

      - name: Run daily mass scraper
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python -u ausbildung_scraper.py
