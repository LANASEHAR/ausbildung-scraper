name: Ausbildung Job Scraper + Email Search

on:
  push:
    branches:
      - main
  schedule:
    # Two complete sessions per day; each session may run up to 4h30.
    - cron: '0 1,13 * * *'
  workflow_dispatch:

concurrency:
  # Keep quick validation-only pushes from waiting behind a 4h30 scheduled scrape.
  group: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[run-scraper]') && 'ausbildung-validation' || 'ausbildung-scraper' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape_jobs:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a 6-hour hard limit; the scraper itself stops
    # after ~4h30 so there is enough time to finish uploads cleanly.
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          check-latest: false

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow pytesseract flake8

      - name: Validate Python syntax and imports
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python -m py_compile ausbildung_scraper.py daily_runner.py
          python -m flake8 ausbildung_scraper.py daily_runner.py --select=F821,F823
          python - <<'PY'
          import os
          import ausbildung_scraper as scraper
          import daily_runner

          required_scraper = [
              "make_session", "clean", "normalize_obfuscated_email", "first_email",
              "iter_collected_links", "scrape_details", "enrich_missing_emails",
              "prioritize_jobs", "send_to_sheet",
          ]
          missing = [name for name in required_scraper if not hasattr(scraper, name)]
          assert not missing, f"Missing scraper symbols: {missing}"

          assert hasattr(daily_runner, "process_batch")
          assert os.environ.get("GOOGLE_SHEET_WEBHOOK_URL"), "GOOGLE_SHEET_WEBHOOK_URL is missing"

          assert scraper.clean("  A   B  ") == "A B"
          assert scraper.valid_email("Test@Example.de") == "test@example.de"
          assert scraper.first_email("Kontakt: test [at] example.de") == "test@example.de"

          class FakeResponse:
              status_code = 200
              def raise_for_status(self):
                  pass
              def json(self):
                  return {"stellenangebote": [{
                      "refnr": "SMOKE-TEST",
                      "aktuelleVeroeffentlichungsdatum": "2026-09-28"
                  }]}

          class FakeSession:
              def __init__(self):
                  self.headers = {}
              def get(self, *args, **kwargs):
                  return FakeResponse()

          smoke_links = scraper.api_search_page(FakeSession(), "Industriekaufmann Ausbildung", 1)
          assert smoke_links and smoke_links[0].startswith("aaapi://"), "BA API parser smoke test failed"

          print("Preflight OK — syntax, undefined names, helpers and BA parser smoke test passed")
          PY

      - name: Verify Google Apps Script Web App before scraping
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = os.environ.get("GOOGLE_SHEET_WEBHOOK_URL", "").strip()
          if not url:
              raise SystemExit("GOOGLE_SHEET_WEBHOOK_URL secret is empty.")

          try:
              response = requests.get(url, timeout=25, allow_redirects=True)
              content_type = response.headers.get("content-type", "")
              response.raise_for_status()
              try:
                  data = response.json()
              except ValueError as exc:
                  preview = " ".join(response.text[:240].split())
                  host = response.url.split("/")[2] if "://" in response.url else "unknown"
                  raise SystemExit(
                      "Google Apps Script health check received non-JSON content. "
                      f"HTTP={response.status_code}; content-type={content_type!r}; "
                      f"final-host={host!r}; body-preview={preview!r}. "
                      "Fix: redeploy Code.gs as a Web App (Execute as: Me; access: Anyone), "
                      "then update GOOGLE_SHEET_WEBHOOK_URL with the new /exec URL."
                  ) from exc
          except SystemExit:
              raise
          except Exception as exc:
              raise SystemExit(
                  "Google Apps Script health check failed before scraping. "
                  f"Details: {type(exc).__name__}: {exc}. "
                  "Check the /exec deployment URL and Web App access settings."
              )

          if not isinstance(data, dict) or data.get("status") != "ok" or data.get("service") != "Ausbildung webhook":
              raise SystemExit(
                  "Google Apps Script responded with unexpected JSON. "
                  "Expected status=ok and service='Ausbildung webhook'. "
                  f"Received keys: {sorted(data.keys())}"
              )

          # GET health alone can pass while POST is served an HTML interstitial.
          # Verify the exact write endpoint with a side-effect-free POST handshake.
          try:
              post = requests.post(
                  url,
                  json={"action": "health"},
                  timeout=(15, 30),
                  allow_redirects=True,
              )
              post.raise_for_status()
              post_data = post.json()
          except Exception as exc:
              raise SystemExit(
                  "Google Apps Script POST health check failed. The live /exec "
                  "deployment is not serving the current Code.gs POST handler. "
                  "Redeploy Code.gs as Web App (Execute as: Me; access: Anyone), "
                  "then rerun. Do NOT reimport recovery data before this check passes. "
                  f"Details: {type(exc).__name__}: {exc}"
              )

          expected_version = "2026-11-09-post-health-v1"
          if (
              not isinstance(post_data, dict)
              or post_data.get("status") != "success"
              or post_data.get("action") != "health"
              or post_data.get("service") != "Ausbildung webhook"
              or post_data.get("deployment_version") != expected_version
          ):
              raise SystemExit(
                  "Google Apps Script POST endpoint is outdated or misconfigured. "
                  "Deploy the latest Code.gs as a new Web App version (Execute as: Me; "
                  "access: Anyone), update GOOGLE_SHEET_WEBHOOK_URL if the deployment "
                  "URL changed, then rerun. Received: "
                  f"{str(post_data)[:500]}"
              )

          print("Google Apps Script GET + POST health checks passed; deployment version is current.")
          PY

      - name: Run 4h30 scraper
        # Manual dispatches and explicit [run-scraper] commits launch a full scrape.
        # Ordinary code pushes run validation only, avoiding accidental long jobs.
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-scraper]')
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python -u daily_runner.py

      - name: Preserve batches not acknowledged by Google Sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ausbildung-recovery-${{ github.run_id }}
          path: recovery/unsent_batches.jsonl
          if-no-files-found: ignore
          retention-days: 30
