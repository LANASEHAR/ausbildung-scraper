name: Daily Agentur Ausbildung Scraper

on:
  schedule:
    # S'exécute automatiquement tous les jours à 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet de le lancer manuellement à tout moment en 1 clic

jobs:
  run-agentur-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Python Scraper
        run: |
          python ausbildung_scraper.py

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ausbildung-agentur-csv
          path: ausbildung_applications_export.csv
